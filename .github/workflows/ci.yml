name: Popcorn CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-popcorn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Popcorn and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest projects/popcorn/tests projects/popcorn_tasting/tests
      - name: Run Popcorn Tasting offline fixture evaluation
        run: python -m popcorn_tasting --mode fixture --output artifacts/evaluation.json --html artifacts/index.html
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-tasting-${{ github.sha }}
          path: artifacts/
      - name: Deploy to Render
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
