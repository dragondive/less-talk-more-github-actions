name: Popcorn CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-popcorn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Popcorn and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest projects/popcorn/tests projects/popcorn_tasting/tests
      - name: Run Popcorn Tasting offline fixture evaluation
        if: always()
        run: python -m popcorn_tasting --mode fixture --output artifacts/evaluation.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-tasting-${{ github.sha }}
          path: artifacts/evaluation.json
      - name: Publish rolling evaluation history
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('artifacts/evaluation.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" /tmp/popcorn-eval-history
          if git -C /tmp/popcorn-eval-history show-ref --verify --quiet refs/remotes/origin/eval-history; then
            git -C /tmp/popcorn-eval-history checkout -B eval-history origin/eval-history
          else
            git -C /tmp/popcorn-eval-history checkout --orphan eval-history
            git -C /tmp/popcorn-eval-history rm -rf --ignore-unmatch .
          fi
          python -m popcorn_tasting.history \
            --history-dir /tmp/popcorn-eval-history \
            --report artifacts/evaluation.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --created-at "$(TZ=UTC date --iso-8601=seconds)"
          git -C /tmp/popcorn-eval-history add index.json runs/
          git -C /tmp/popcorn-eval-history config user.name github-actions[bot]
          git -C /tmp/popcorn-eval-history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/popcorn-eval-history checkout --orphan eval-history-snapshot
          git -C /tmp/popcorn-eval-history add index.json runs/
          git -C /tmp/popcorn-eval-history commit -m "Refresh rolling Popcorn evaluation history"
          git -C /tmp/popcorn-eval-history push --force origin HEAD:eval-history
      - name: Deploy to Render
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
