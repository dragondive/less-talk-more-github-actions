name: Popcorn CI and evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Popcorn and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Run golden evaluations
        run: python -m popcorn_tasting --output artifacts/evaluation.json --coverage-output artifacts/coverage.txt
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-evaluation
          path: artifacts/
          if-no-files-found: ignore
