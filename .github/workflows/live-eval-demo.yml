name: Popcorn Full Evaluation Demo

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions for each version (more runs show more model variation)
        type: choice
        options: ["3", "5"]
        default: "3"
      provider_data:
        description: TMDB source for tool evidence (fixture isolates LLM quality; live checks the external API too)
        type: choice
        options: [fixture, live]
        default: fixture

permissions:
  contents: write

jobs:
  live-eval-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Popcorn and evaluation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all Python tests
        id: unit-tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m pytest projects/popcorn/tests projects/popcorn_tasting/tests --junitxml=artifacts/unit-tests.xml
      - name: Run all offline AI evaluation scenarios
        id: offline-evaluation
        continue-on-error: true
        run: python -m popcorn_tasting --mode fixture --output artifacts/offline-evaluation.json
      - name: Validate live evaluation credentials
        id: credentials
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          PROVIDER_DATA: ${{ inputs.provider_data }}
        run: |
          if [ -z "$SARVAM_API_KEY" ]; then
            echo "::error title=Missing GitHub Actions secret::Add SARVAM_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "$PROVIDER_DATA" = "live" ] && [ -z "$TMDB_ACCESS_TOKEN" ]; then
            echo "::error title=Missing GitHub Actions secret::Live TMDB mode requires TMDB_ACCESS_TOKEN under Settings > Secrets and variables > Actions. Choose fixture mode to avoid this TMDB credential."
            exit 1
          fi
      - name: Run passing baseline with live Sarvam and Popcorn MCP
        id: baseline
        continue-on-error: true
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          LLM_PROVIDER: sarvam
          FIXTURE_PROVIDER_DATA: ${{ inputs.provider_data == 'fixture' }}
        run: |
          if [ "$FIXTURE_PROVIDER_DATA" = "true" ]; then provider_flag=--fixture-provider-data; else provider_flag=; fi
          python -m popcorn_tasting --mode live-judge --dataset projects/popcorn_tasting/data/golden/live_judge_demo.json --repetitions "${{ inputs.repetitions }}" $provider_flag --output artifacts/live-baseline.json
      - name: Run intentional tool-catalog regression
        id: regression
        if: always() && hashFiles('artifacts/live-baseline.json') != ''
        continue-on-error: true
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          LLM_PROVIDER: sarvam
          FIXTURE_PROVIDER_DATA: ${{ inputs.provider_data == 'fixture' }}
        run: |
          if [ "$FIXTURE_PROVIDER_DATA" = "true" ]; then provider_flag=--fixture-provider-data; else provider_flag=; fi
          python -m popcorn_tasting --mode live-judge --dataset projects/popcorn_tasting/data/golden/live_judge_demo.json --repetitions "${{ inputs.repetitions }}" $provider_flag --inject-regression --baseline artifacts/live-baseline.json --output artifacts/live-regression.json
      - name: Run recovery version
        id: recovery
        if: always() && hashFiles('artifacts/live-regression.json') != ''
        continue-on-error: true
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          LLM_PROVIDER: sarvam
          FIXTURE_PROVIDER_DATA: ${{ inputs.provider_data == 'fixture' }}
        run: |
          if [ "$FIXTURE_PROVIDER_DATA" = "true" ]; then provider_flag=--fixture-provider-data; else provider_flag=; fi
          python -m popcorn_tasting --mode live-judge --dataset projects/popcorn_tasting/data/golden/live_judge_demo.json --repetitions "${{ inputs.repetitions }}" $provider_flag --baseline artifacts/live-regression.json --output artifacts/live-recovery.json
      - name: Combine all evaluation results for the dashboard
        id: full-report
        if: always() && steps.credentials.outcome == 'success' && hashFiles('artifacts/unit-tests.xml', 'artifacts/offline-evaluation.json', 'artifacts/live-baseline.json', 'artifacts/live-regression.json', 'artifacts/live-recovery.json') != ''
        continue-on-error: true
        run: |
          python -m popcorn_tasting.full_report \
            --junit artifacts/unit-tests.xml \
            --offline artifacts/offline-evaluation.json \
            --baseline artifacts/live-baseline.json \
            --regression artifacts/live-regression.json \
            --recovery artifacts/live-recovery.json \
            --output artifacts/full-evaluation.json
      - name: Upload full evaluation reports
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-full-evaluation-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: error
      - name: Publish the unified report to dashboard history
        if: always() && hashFiles('artifacts/full-evaluation.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" /tmp/popcorn-live-history
          if git -C /tmp/popcorn-live-history show-ref --verify --quiet refs/remotes/origin/eval-history; then
            git -C /tmp/popcorn-live-history checkout -B eval-history origin/eval-history
          else
            git -C /tmp/popcorn-live-history checkout --orphan eval-history
            git -C /tmp/popcorn-live-history rm -rf --ignore-unmatch .
          fi
          python -m popcorn_tasting.history \
            --history-dir /tmp/popcorn-live-history \
            --report artifacts/full-evaluation.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --created-at "$(TZ=UTC date --iso-8601=seconds)"
          git -C /tmp/popcorn-live-history add index.json runs/
          git -C /tmp/popcorn-live-history config user.name github-actions[bot]
          git -C /tmp/popcorn-live-history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/popcorn-live-history checkout --orphan eval-history-snapshot
          git -C /tmp/popcorn-live-history add index.json runs/
          git -C /tmp/popcorn-live-history commit -m "Publish full Popcorn evaluation results"
          git -C /tmp/popcorn-live-history push --force origin HEAD:eval-history
      - name: Verify the full evaluation suite
        if: always() && steps.credentials.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          report_path = Path("artifacts/full-evaluation.json")
          if not report_path.exists():
              raise SystemExit("The unified evaluation report was not generated.")
          with report_path.open(encoding="utf-8") as report_file:
              report = json.load(report_file)
          unit = report["unit_tests"]
          offline = report["offline_evaluation"]
          live = report["live_evaluation"]
          print(f"Unit tests: {unit['passed']}/{unit['total']} passed")
          print(f"Offline AI scenarios: {offline['case_count']} · passed={offline['passed']}")
          print(f"Live LLM regression demo: passed={live['passed']} · score drop={live['regression_score_drop']}")
          sys.exit(0 if report["passed"] else 1)
