[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "popcorn-agent-demo"
version = "0.1.0"
description = "Popcorn entertainment discovery agent demo"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "starlette==1.10.0", "uvicorn==0.54.0"]

[project.scripts]
popcorn = "popcorn.__main__:main"
popcorn-mcp = "popcorn.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
popcorn = ["static/*.html"]
