[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "popcorn-tasting-demo"
version = "0.1.0"
description = "Popcorn skill, MCP, and response evaluation demo"
requires-python = ">=3.11"

[project.scripts]
popcorn-tasting = "popcorn_tasting.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
