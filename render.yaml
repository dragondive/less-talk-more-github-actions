services:
  - type: web
    name: popcorn-demo-web
    runtime: python
    plan: free
    rootDir: projects/popcorn
    buildCommand: pip install .
    startCommand: uvicorn popcorn.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
